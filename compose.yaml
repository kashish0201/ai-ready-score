# Compatible with Podman Compose (`podman compose up --build`) and Docker Compose.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload source without rebuilding the image
      - ./backend:/app/backend
    environment:
      - ENVIRONMENT=development
    # Reload for local compose; image CMD omits --reload for production use
    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Browser hits localhost:5173; Vite proxies /api to the backend service
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
